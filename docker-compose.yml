services:
  postgres:
    image: postgres:17-alpine
    container_name: nesaga_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nlc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nlc_production_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-nlc_prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nlc} -d ${POSTGRES_DB:-nlc_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nesaga_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-nlc}:${POSTGRES_PASSWORD:-nlc_production_pass_2026}@postgres:5432/${POSTGRES_DB:-nlc_prod}"
      UPLOADS_DIR: "/app/uploads"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
